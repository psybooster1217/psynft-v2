# Build settings mirror the original PsyNFT deployment for parity:
#   solc 0.8.20, EVM "paris", optimizer enabled @ 1,000,000 runs.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.20"
evm_version = "paris"
optimizer = true
optimizer_runs = 1_000_000
# Scripts/tests read the holder snapshot from ./snapshot.
fs_permissions = [{ access = "read", path = "./snapshot" }, { access = "read-write", path = "./safe-batches" }]

[profile.ci]
verbosity = 3
fuzz = { runs = 512 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
mainnet = {key = "${ETHERSCAN_API_KEY}"}
sepolia = {key = "${ETHERSCAN_API_KEY}"}

# Invariant suite (test/invariant/): random sequences of role actions.
[invariant]
runs = 256
depth = 100
fail_on_revert = true
